<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Meme Slider</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <input type="radio" name="slider" id="slider1" checked />
    <input type="radio" name="slider" id="slider2" />
    <input type="radio" name="slider" id="slider3" />
    <input type="radio" name="slider" id="slider4" />
    <input type="radio" name="slider" id="slider5" />

    <label for="slider1" class="buttons">slider1</label>
    <label for="slider2" class="buttons">slider2</label>
    <label for="slider3" class="buttons">slider3</label>
    <label for="slider4" class="buttons">slider4</label>
    <label for="slider5" class="buttons">slider5</label>

    <div class="window">
      <div class="tape-images">
        <div class="slide">
          <img
            src="img/Bern.jpeg"
            alt="Aerial view of Bern old town with the Aare river"
          />
          <p>Bern</p>
        </div>
        <div class="slide">
          <img
            src="img/Lucerne.jpeg"
            alt="Lucerne Chapel Bridge and water tower on the river"
          />
          <p>Lucerne</p>
        </div>
        <div class="slide">
          <img
            src="img/Lugano.jpeg"
            alt="Lugano lakeside promenade with palm trees and mountains"
          />
          <p>Lugano</p>
        </div>
        <div class="slide">
          <img
            src="img/Montreux.jpeg"
            alt="Montreux waterfront on Lake Geneva with the Alps"
          />
          <p>Montreux</p>
        </div>
        <div class="slide">
          <img
            src="img/Zermatt.jpeg"
            alt="Zermatt village with the Matterhorn peak in the background"
          />
          <p>Zermatt</p>
        </div>
      </div>
    </div>
  </body>
</html>
